<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriConnect PNG – Cash Crop CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌴%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef5ef;--card:#fff;--tx:#14301f;--mu:#62786a;--ln:#dde8df;--g:#1f8f55;--am:#f2a93b;--rd:#e5484d;--pu:#8b5cf6;--bl:#3b82c4;--side:#0f3b28;--in:#f6faf6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1912;--card:#15261b;--tx:#e6f1e8;--mu:#92a99a;--ln:#243a2c;--side:#081f15;--in:#0f1f16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1912;--card:#15261b;--tx:#e6f1e8;--mu:#92a99a;--ln:#243a2c;--side:#081f15;--in:#0f1f16;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Palatino Linotype",serif;margin:0;font-weight:700}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--side),#1b6b44);color:#e8f6ec;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand b{font:700 19px Georgia,serif;line-height:1.1}.brand small{display:block;opacity:.7;font-size:11px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#f2a93b,#e07b2a);display:grid;place-items:center;font-size:22px}
.nb{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#cfe8d6}
.nb:hover{background:rgba(255,255,255,.1)}.nb.on{background:#f2a93b;color:#3a2605;font-weight:700}
.nb:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.sfoot{margin-top:auto;font-size:12px;opacity:.75;padding:8px}
.main{padding:22px 26px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:28px}.top p{margin:2px 0 0;color:var(--mu)}
.me{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);padding:6px 10px;border-radius:12px}
select,input,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;width:100%}
.me select{width:auto;border:0;background:transparent;font-weight:700}
.grid{display:grid;gap:14px}.k5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;min-width:0}
.card h3{font-size:17px;margin-bottom:10px}
.kpi{position:relative;overflow:hidden;color:#fff;border:0;padding:16px}
.kpi b{display:block;font:700 28px Georgia,serif}.kpi span{opacity:.92;font-size:13px}.kpi i{position:absolute;right:10px;top:6px;font-size:34px;opacity:.28;font-style:normal}
.btn{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;font:700 14px inherit;background:var(--g);color:#fff}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--ln)}.btn.dg{background:var(--rd)}.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.chip{display:inline-flex;gap:5px;align-items:center;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--in);border:1px solid var(--ln)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.crumbs button{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--ln);padding:5px 12px;border-radius:99px;font-size:13px}
.crumbs button:last-child{background:var(--g);color:#fff;border-color:var(--g)}
.node{cursor:pointer;transition:transform .15s,box-shadow .15s;border-left:6px solid var(--g)}
.node:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,59,40,.15)}
.node h3{font-size:18px}.node .m{color:var(--mu);font-size:13px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.rec{display:grid;grid-template-columns:96px 1fr;gap:12px}
.ph{width:96px;height:96px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,#bfe5c2,#6fcf6a);display:grid;place-items:center;font-size:34px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left}.tbl th{color:var(--mu);font-weight:600}
.scroll{overflow-x:auto}
.bar{height:10px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.ov{position:fixed;inset:0;background:rgba(5,20,12,.6);display:none;place-items:center;padding:16px;z-index:50}
.ov.on{display:grid}.md{background:var(--card);border-radius:18px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;color:var(--mu);display:block;margin:8px 0 3px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#123d2a;color:#fff;padding:10px 18px;border-radius:12px;z-index:60;display:none}
.role{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;color:#fff}
.empty{text-align:center;color:var(--mu);padding:26px}
@media(max-width:820px){.app{display:block}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.brand,.sfoot{display:none}.nb{white-space:nowrap}.main{padding:16px 14px 50px}.f2{grid-template-columns:1fr}}
</style></head>
<body>
<div class="app">
<nav class="side" aria-label="Main">
 <div class="brand"><div class="logo">🌴</div><div><b>AgriConnect</b><small>Cash Crop CRM · PNG</small></div></div>
 <button class="nb" data-v="dash">📊 Dashboard</button>
 <button class="nb" data-v="browse">🗺️ Province Portal</button>
 <button class="nb" data-v="perf">⚡ System Performance</button>
 <button class="nb" data-v="admin">🛡️ Admin &amp; Roles</button>
 <div class="sfoot">Province → LLG → Clan → Family → Farmer</div>
</nav>
<main class="main"><div class="top"><div><h1 id="ttl"></h1><p id="sub"></p></div>
<div class="me">Signed in as <select id="me" aria-label="Switch user"></select></div></div><div id="v"></div></main>
</div>
<div class="ov" id="ov"><div class="md" id="md"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='agri-crm-v1',CK=['llgs','clans','families','farmers'],LV=['Province','LLG','Clan','Family','Farmer'];
const K=[['sap','Saplings','#6fcf6a'],['mat','Matured trees','#1f8f55'],['harv','To be harvested','#f2a93b'],['lost','Trees lost','#e5484d'],['other','Other','#8b5cf6']];
const ROLES={'Super Admin':{c:'#0f3b28',s:1,r:1,u:1},'Province Admin':{c:'#3b82c4',s:1,r:1},'LLG Officer':{c:'#e07b2a',s:1,r:1},'Field Officer':{c:'#1f8f55',r:1},'Viewer':{c:'#7a8a80'}};
const CROPS=['Cocoa','Coffee','Oil Palm','Coconut','Vanilla','Rubber'];
let D,view='dash',path=[],pend=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=n=>(+n||0).toLocaleString();const uid=p=>p+Math.random().toString(36).slice(2,8);
function seed(){let s=11;const rnd=()=>(s=s*16807%2147483647)/2147483647,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pk=a=>a[ri(0,a.length-1)];
 const P={'Morobe':['Wampar Rural','Markham Rural'],'East New Britain':['Gazelle Rural','Kokopo Rural'],'Central':['Hiri Rural','Koiari Rural'],'Oro':['Popondetta Urban','Sohe Rural'],'Western Highlands':['Dei Rural','Mt Hagen Rural']};
 const cl=['Ranu','Kopi','Mara','Sihi','Gari','Vula'],fa=['Tauvasa','Kila','Waim','Toka','Namaliu','Kaupa'],fn=['Joseph','Mary','Peter','Agnes','Samuel','Ruth','Paul','Grace'];
 const provinces=Object.entries(P).map(([n,ls])=>({id:uid('p'),name:n,llgs:ls.map(l=>({id:uid('l'),name:l,clans:[0,1].map(i=>({id:uid('c'),name:pk(cl)+' Clan',families:[0,1].map(j=>{const f=pk(fa);return{id:uid('f'),name:f+' Family',farmers:[0,1].map(()=>({id:uid('m'),name:pk(fn)+' '+f,phone:'7'+ri(1e6,9e6),records:Array.from({length:ri(1,2)},()=>({id:uid('r'),crop:pk(CROPS),sap:ri(20,400),mat:ri(30,300),harv:ri(10,150),lost:ri(0,60),other:ri(0,25),img:'',note:'',date:new Date(Date.now()-ri(0,170)*864e5).toISOString().slice(0,10)}))}))}})}))}))}));
 return{provinces,me:'u1',log:[],users:[{id:'u1',name:'Dr. Kila Waim',role:'Super Admin',scope:'National',on:1},{id:'u2',name:'Mary Toka',role:'Province Admin',scope:'Morobe',on:1},{id:'u3',name:'Peter Namaliu',role:'LLG Officer',scope:'Gazelle Rural',on:1},{id:'u4',name:'Agnes Kaupa',role:'Field Officer',scope:'Central',on:1},{id:'u5',name:'Joe Ranu',role:'Viewer',scope:'National',on:1}]}}
function load(){try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!D||!D.provinces)D=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Storage is full – remove some photos to save more.')}}
const me=()=>D.users.find(u=>u.id===D.me)||D.users[0],can=k=>!!ROLES[me().role][k];
function act(m){D.log.unshift({t:new Date().toISOString(),u:me().name,m});D.log=D.log.slice(0,25);save()}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function recsOf(n,l){return l==4?n.records:(n[CK[l]]||[]).flatMap(c=>recsOf(c,l+1))}
function fCount(n,l){return l==4?1:(n[CK[l]]||[]).reduce((s,c)=>s+fCount(c,l+1),0)}
function sum(rs){const o={sap:0,mat:0,harv:0,lost:0,other:0};rs.forEach(r=>K.forEach(k=>o[k[0]]+=+r[k[0]]||0));o.all=o.sap+o.mat+o.harv+o.other;return o}
function flat(){const a=[];D.provinces.forEach(p=>p.llgs.forEach(l=>l.clans.forEach(c=>c.families.forEach(f=>f.farmers.forEach(m=>m.records.forEach(r=>a.push({p,l,c,f,m,r})))))));return a}
function nodeAt(pa){let n=null,l=D.provinces;pa.forEach((id,i)=>{n=l.find(x=>x.id==id);l=n?n[CK[i]]||[]:[]});return n}
/* ---------- charts ---------- */
function stack(rows){const mx=Math.max(1,...rows.map(r=>r.v.sap+r.v.mat+r.v.harv+r.v.lost+r.v.other)),H=rows.length*34+8;
 return `<svg viewBox="0 0 560 ${H}" width="100%" role="img" aria-label="Trees by status per crop">`+rows.map((r,i)=>{let x=96;const y=i*34+6;
 return `<text x="0" y="${y+16}" font-size="13" fill="currentColor">${esc(r.l)}</text>`+K.map(k=>{const w=r.v[k[0]]/mx*450;const s=`<rect x="${x}" y="${y}" width="${w}" height="22" rx="4" fill="${k[2]}"><title>${k[1]}: ${N(r.v[k[0]])}</title></rect>`;x+=w;return s}).join('')}).join('')+'</svg>'}
function donut(v){const t=K.reduce((s,k)=>s+v[k[0]],0)||1;let off=0;const R=62,C=2*Math.PI*R;
 return `<svg viewBox="0 0 160 160" width="170" role="img" aria-label="Status share"><g transform="rotate(-90 80 80)">`+K.map(k=>{const f=v[k[0]]/t*C,s=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${k[2]}" stroke-width="24" stroke-dasharray="${f} ${C-f}" stroke-dashoffset="${-off}"><title>${k[1]}</title></circle>`;off+=f;return s}).join('')+`</g><text x="80" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor" font-family="Georgia">${N(t)}</text><text x="80" y="96" text-anchor="middle" font-size="10" fill="currentColor" opacity=".7">trees</text></svg>`}
function cols(items){const mx=Math.max(1,...items.map(i=>i.v));const w=560/items.length;
 return `<svg viewBox="0 0 560 200" width="100%" role="img" aria-label="Trees per province"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2a93b"/><stop offset="1" stop-color="#1f8f55"/></linearGradient></defs>`+items.map((it,i)=>{const h=it.v/mx*140;return `<rect x="${i*w+w*.18}" y="${160-h}" width="${w*.64}" height="${h}" rx="8" fill="url(#gg)"><title>${esc(it.l)}: ${N(it.v)}</title></rect><text x="${i*w+w/2}" y="${153-h}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${N(it.v)}</text><text x="${i*w+w/2}" y="182" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75">${esc(it.l.length>12?it.l.slice(0,11)+'…':it.l)}</text>`}).join('')+'</svg>'}
function area(items){const mx=Math.max(1,...items.map(i=>i.v)),w=520/Math.max(1,items.length-1);const pts=items.map((it,i)=>[20+i*w,150-it.v/mx*120]);
 const d=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
 return `<svg viewBox="0 0 560 190" width="100%" role="img" aria-label="Trees recorded per month"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82c4" stop-opacity=".45"/><stop offset="1" stop-color="#3b82c4" stop-opacity="0"/></linearGradient></defs><path d="${d} L${pts.at(-1)[0]} 150 L20 150Z" fill="url(#ag)"/><path d="${d}" fill="none" stroke="#3b82c4" stroke-width="3" stroke-linejoin="round"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#3b82c4"><title>${N(items[i].v)}</title></circle><text x="${p[0]}" y="172" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75">${items[i].l}</text>`).join('')+'</svg>'}
const legend=()=>'<div class="tags">'+K.map(k=>`<span class="chip"><i class="dot" style="background:${k[2]}"></i>${k[1]}</span>`).join('')+'</div>';
const tags=v=>'<div class="tags">'+K.map(k=>`<span class="chip"><i class="dot" style="background:${k[2]}"></i>${k[1].split(' ')[0]} <b>${N(v[k[0]])}</b></span>`).join('')+'</div>';
/* ---------- views ---------- */
function dash(){const all=flat(),rs=all.map(e=>e.r),t=sum(rs),farmers=D.provinces.reduce((s,p)=>s+fCount(p,0),0);
 const crops=CROPS.map(c=>({l:c,v:sum(rs.filter(r=>r.crop==c))})).filter(c=>c.v.all+c.v.lost>0);
 const prov=D.provinces.map(p=>({l:p.name,v:sum(recsOf(p,0)).all}));
 const mths=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=d.toISOString().slice(0,7);mths.push({l:d.toLocaleString('en',{month:'short'}),v:sum(rs.filter(r=>(r.date||'').slice(0,7)==k)).all})}
 const kp=[['Farmers',farmers,'👨‍🌾','#1f8f55,#4cc38a'],['Total trees',t.all,'🌴','#0f3b28,#2f8f62'],['Saplings',t.sap,'🌱','#4aa84a,#8ee07f'],['Matured',t.mat,'🌳','#157347,#34b37a'],['To harvest',t.harv,'🧺','#e0891a,#f6c35c'],['Trees lost',t.lost,'🥀','#c93a3f,#f07b7e']];
 const rec=all.sort((a,b)=>b.r.date.localeCompare(a.r.date)).slice(0,5);
 return `<div class="grid k5">${kp.map(k=>`<div class="card kpi" style="background:linear-gradient(135deg,${k[3].split(',')[0]},${k[3].split(',')[1]})"><i>${k[2]}</i><b>${N(k[1])}</b><span>${k[0]}</span></div>`).join('')}</div>
 <div class="grid c2" style="margin-top:14px"><div class="card"><h3>Trees by status for each cash crop</h3>${legend()}<div class="scroll">${stack(crops)}</div></div>
 <div class="card"><h3>Overall tree status</h3><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${donut(t)}<div style="flex:1;min-width:150px">${K.map(k=>`<div style="margin:6px 0;font-size:13px"><i class="dot" style="background:${k[2]}"></i> ${k[1]} <b style="float:right">${N(t[k[0]])}</b></div>`).join('')}</div></div></div>
 <div class="card"><h3>Trees per province</h3>${cols(prov)}</div>
 <div class="card"><h3>Trees recorded, last 6 months</h3>${area(mths)}</div></div>
 <div class="card" style="margin-top:14px"><h3>Latest field records</h3><div class="scroll"><table class="tbl"><tr><th>Farmer</th><th>Crop</th><th>Location</th><th>Trees</th><th>Date</th></tr>${rec.map(e=>`<tr><td>${esc(e.m.name)}</td><td>${esc(e.r.crop)}</td><td>${esc(e.p.name)} › ${esc(e.l.name)}</td><td>${N(sum([e.r]).all)}</td><td>${e.r.date}</td></tr>`).join('')}</table></div></div>`}
function browse(){const d=path.length,node=d?nodeAt(path):null;
 const names=path.map((_,i)=>nodeAt(path.slice(0,i+1)).name);
 let h=`<div class="crumbs"><button onclick="crumb(0)">🌏 All provinces</button>${names.map((n,i)=>`<button onclick="crumb(${i+1})">${LV[i]}: ${esc(n)}</button>`).join('')}</div>`;
 if(d==5)return h+farmerView(node);
 const list=d?node[CK[d-1]]:D.provinces,cols=['#1f8f55','#e07b2a','#3b82c4','#8b5cf6','#c9a227'];
 h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap"><h2>${LV[d]}s${d?' in '+esc(names.at(-1)):''}</h2><button class="btn" ${can('s')?'':'disabled title="Your role cannot add records here"'} onclick="addNode()">+ Add ${LV[d]}</button></div>`;
 if(!list.length)return h+`<div class="card empty">No ${LV[d].toLowerCase()}s yet. Use “Add ${LV[d]}” to create the first one.</div>`;
 return h+`<div class="grid c2">`+list.map((x,i)=>{const t=sum(recsOf(x,d)),sub=d<4?x[CK[d]]?.length:0;
 return `<div class="card node" style="border-left-color:${cols[d]}" tabindex="0" onclick="drill('${x.id}')" onkeydown="if(event.key=='Enter')drill('${x.id}')"><div style="display:flex;justify-content:space-between"><h3>${esc(x.name)}</h3>${can('s')?`<button class="btn sm sec" onclick="event.stopPropagation();delNode('${x.id}')" aria-label="Delete">🗑</button>`:''}</div>
 <div class="m">${d<4?`<span>${sub} ${LV[d+1]}${sub==1?'':'s'}</span>`:`<span>📞 ${esc(x.phone||'—')}</span>`}<span>👨‍🌾 ${fCount(x,d)} farmers</span><span>🌴 ${N(t.all)} trees</span></div>
 <div class="bar" style="margin-top:10px;display:flex">${K.map(k=>`<i style="width:${t.all+t.lost?t[k[0]]/(t.all+t.lost)*100:0}%;background:${k[2]};border-radius:0"></i>`).join('')}</div></div>`}).join('')+'</div>'}
function farmerView(m){const t=sum(m.records);
 return `<div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><h2>👨‍🌾 ${esc(m.name)}</h2><span style="color:var(--mu)">📞 ${esc(m.phone||'—')}</span></div><button class="btn" ${can('r')?'':'disabled'} onclick="recForm()">+ Add crop record</button></div>${tags(t)}</div>
 ${m.records.length?'<div class="grid c2">'+m.records.map(r=>{const s=sum([r]);return `<div class="card rec">${r.img?`<img class="ph" src="${r.img}" alt="${esc(r.crop)} trees">`:'<div class="ph">🌴</div>'}<div><h3>${esc(r.crop)}</h3><small style="color:var(--mu)">${r.date}${r.note?' · '+esc(r.note):''}</small>${tags(r)}${can('r')?`<button class="btn sm sec" onclick="recForm('${r.id}')">Edit</button> <button class="btn sm sec" onclick="delRec('${r.id}')">Delete</button>`:''}</div></div>`}).join('')+'</div>':'<div class="card empty">No cash crop records yet for this farmer.</div>'}`}
function perf(){const all=flat(),rs=all.map(e=>e.r),farmers=D.provinces.flatMap(p=>p.llgs.flatMap(l=>l.clans.flatMap(c=>c.families.flatMap(f=>f.farmers)))),
 comp=farmers.length?farmers.filter(f=>f.records.length).length/farmers.length*100:0,ph=rs.length?rs.filter(r=>r.img).length/rs.length*100:0,kb=new Blob([JSON.stringify(D)]).size/1024,wk=rs.filter(r=>Date.now()-new Date(r.date)<7*864e5).length;
 const sc=D.provinces.map(p=>{const t=sum(recsOf(p,0)),tot=t.all+t.lost||1;const prod=(t.mat+t.harv)/tot,surv=1-t.lost/tot;return{n:p.name,s:Math.round(100*(.6*prod+.4*surv)),t,loss:t.lost/tot*100}}).sort((a,b)=>b.s-a.s);
 const m=(l,v,c)=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><span>${l}</span><b>${Math.round(v)}%</b></div><div class="bar"><i style="width:${Math.min(100,v)}%;background:${c}"></i></div></div>`;
 return `<div class="grid c2"><div class="card"><h3>System health</h3>${m('Farmers with at least one record',comp,'#1f8f55')}${m('Records with a tree photo',ph,'#3b82c4')}${m('Local storage used (of ~5 MB)',kb/5120*100,kb>3500?'#e5484d':'#f2a93b')}
 <div class="tags"><span class="chip">${N(rs.length)} records</span><span class="chip">${N(farmers.length)} farmers</span><span class="chip">${wk} added this week</span><span class="chip">${kb.toFixed(0)} KB</span></div></div>
 <div class="card"><h3>Province performance score</h3><p style="color:var(--mu);margin:0 0 6px;font-size:13px">60% productive trees (matured + to harvest) and 40% survival.</p>${sc.map(s=>m(esc(s.n)+` <small style="color:var(--mu)">loss ${s.loss.toFixed(1)}%</small>`,s.s,s.s>=70?'#1f8f55':s.s>=55?'#f2a93b':'#e5484d')).join('')}</div></div>`}
function admin(){const isA=can('u');
 return `<div class="grid c2"><div class="card" style="grid-column:1/-1"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>Users &amp; roles</h3><button class="btn" ${isA?'':'disabled title="Only a Super Admin can manage users"'} onclick="userForm()">+ Add user</button></div>
 <div class="scroll"><table class="tbl"><tr><th>Name</th><th>Role</th><th>Area</th><th>Status</th></tr>${D.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${isA?`<select onchange="setRole('${u.id}',this.value)" style="width:auto">${Object.keys(ROLES).map(r=>`<option ${r==u.role?'selected':''}>${r}</option>`).join('')}</select>`:`<span class="role" style="background:${ROLES[u.role].c}">${u.role}</span>`}</td><td>${esc(u.scope)}</td><td><button class="btn sm ${u.on?'':'sec'}" ${isA?'':'disabled'} onclick="toggleU('${u.id}')">${u.on?'Active':'Disabled'}</button></td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>Permission matrix</h3><div class="scroll"><table class="tbl"><tr><th>Role</th><th>Manage structure</th><th>Edit records</th><th>Manage users</th></tr>${Object.entries(ROLES).map(([n,r])=>`<tr><td><span class="role" style="background:${r.c}">${n}</span></td><td>${r.s?'✅':'—'}</td><td>${r.r?'✅':'—'}</td><td>${r.u?'✅':'—'}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>Activity log</h3>${D.log.length?D.log.slice(0,8).map(l=>`<div style="padding:6px 0;border-bottom:1px solid var(--ln);font-size:13px"><b>${esc(l.u)}</b> ${esc(l.m)}<br><small style="color:var(--mu)">${new Date(l.t).toLocaleString()}</small></div>`).join(''):'<div class="empty">Actions you take will be listed here.</div>'}</div></div>`}
/* ---------- actions ---------- */
const T={dash:['Dashboard','Cash crop health across every province'],browse:['Province Portal','Drill down from province to farmer records'],perf:['System Performance','Data quality and province scorecards'],admin:['Admin & Roles','Control who can see and change data']};
function R(){document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.v==view));document.getElementById('ttl').textContent=T[view][0];document.getElementById('sub').textContent=T[view][1];
 document.getElementById('me').innerHTML=D.users.filter(u=>u.on).map(u=>`<option value="${u.id}" ${u.id==D.me?'selected':''}>${esc(u.name)} (${u.role})</option>`).join('');
 document.getElementById('v').innerHTML={dash,browse,perf,admin}[view]()}
function go(v){view=v;R()}function crumb(n){path=path.slice(0,n);R()}function drill(id){path.push(id);R()}
function modal(h){document.getElementById('md').innerHTML=h;document.getElementById('ov').classList.add('on')}
function closeM(){document.getElementById('ov').classList.remove('on')}
const val=id=>document.getElementById(id).value.trim();
function addNode(){const d=path.length;modal(`<h3>Add ${LV[d]}</h3><label>${LV[d]} name</label><input id="fn" autofocus>${d==4?'<label>Phone (optional)</label><input id="fp">':''}<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeM()">Cancel</button><button class="btn" onclick="saveNode()">Save ${LV[d].toLowerCase()}</button></div>`)}
function saveNode(){const d=path.length,name=val('fn');if(!name)return toast('Enter a name first.');const o={id:uid(['p','l','c','f','m'][d]),name};
 if(d==4){o.phone=val('fp');o.records=[]}else if(d<4)o[CK[d]]=[];
 (d?nodeAt(path)[CK[d-1]]:D.provinces).push(o);act(`added ${LV[d]} “${name}”`);closeM();R()}
function delNode(id){const d=path.length;modal(`<h3>Delete this ${LV[d].toLowerCase()}?</h3><p>Everything inside it, including crop records and photos, will be removed.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeM()">Keep it</button><button class="btn dg" onclick="doDel('${id}')">Delete</button></div>`)}
function doDel(id){const d=path.length,l=d?nodeAt(path)[CK[d-1]]:D.provinces,i=l.findIndex(x=>x.id==id);act(`deleted ${LV[d]} “${l[i].name}”`);l.splice(i,1);closeM();R()}
function recForm(id){const m=nodeAt(path),r=m.records.find(x=>x.id==id)||{crop:'',sap:0,mat:0,harv:0,lost:0,other:0,img:'',note:''};pend=r.img;window._rid=id||null;
 modal(`<h3>${id?'Edit':'Add'} crop record · ${esc(m.name)}</h3><label>Cash crop</label><input id="rc" list="cl" value="${esc(r.crop)}" placeholder="e.g. Cocoa"><datalist id="cl">${CROPS.map(c=>`<option>${c}</option>`).join('')}</datalist>
 <div class="f2">${K.map(k=>`<div><label>${k[1]}</label><input id="r_${k[0]}" type="number" min="0" value="${r[k[0]]}"></div>`).join('')}</div><label>Note (optional)</label><input id="rn" value="${esc(r.note)}">
 <label>Photo of the trees</label><input type="file" accept="image/*" onchange="pick(this)"><img id="pv" class="ph" style="width:100%;height:150px;margin-top:8px;${r.img?'':'display:none'}" src="${r.img||''}" alt="Preview">
 <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeM()">Cancel</button><button class="btn" onclick="saveRec()">Save record</button></div>`)}
function pick(inp){const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,520/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pend=c.toDataURL('image/jpeg',.72);const p=document.getElementById('pv');p.src=pend;p.style.display='block'};im.src=fr.result};fr.readAsDataURL(f)}
function saveRec(){const crop=val('rc');if(!crop)return toast('Enter the cash crop name.');const m=nodeAt(path);let r=m.records.find(x=>x.id==window._rid);if(!r){r={id:uid('r'),date:new Date().toISOString().slice(0,10)};m.records.unshift(r)}
 Object.assign(r,{crop,note:val('rn'),img:pend||''});K.forEach(k=>r[k[0]]=Math.max(0,+val('r_'+k[0])||0));act(`saved ${crop} record for ${m.name}`);closeM();R();toast('Record saved')}
function delRec(id){const m=nodeAt(path);m.records=m.records.filter(r=>r.id!=id);act(`deleted a record for ${m.name}`);R()}
function userForm(){modal(`<h3>Add user</h3><label>Full name</label><input id="un"><label>Role</label><select id="ur">${Object.keys(ROLES).map(r=>`<option>${r}</option>`).join('')}</select><label>Area (province or LLG)</label><input id="us" value="National"><div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeM()">Cancel</button><button class="btn" onclick="saveUser()">Add user</button></div>`)}
function saveUser(){const n=val('un');if(!n)return toast('Enter the user’s name.');D.users.push({id:uid('u'),name:n,role:val('ur'),scope:val('us')||'National',on:1});act(`added user ${n}`);closeM();R()}
function setRole(id,r){const u=D.users.find(x=>x.id==id);u.role=r;act(`set ${u.name} to ${r}`);R()}
function toggleU(id){const u=D.users.find(x=>x.id==id);if(u.id==D.me)return toast('You can’t disable your own account.');u.on=u.on?0:1;act(`${u.on?'enabled':'disabled'} ${u.name}`);R()}
document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>go(b.dataset.v));
document.getElementById('me').onchange=e=>{D.me=e.target.value;save();R();toast('Switched to '+me().role)};
document.getElementById('ov').onclick=e=>{if(e.target.id=='ov')closeM()};
load();R();
</script></body></html>
